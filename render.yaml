# Render Blueprint (New + -> Blueprint, point at your GitHub repo).
# NOTE: written from Render's documented schema but not deployed/tested by the author;
# check field names against https://render.com/docs/blueprint-spec if Render rejects it.
databases:
  - name: fraud-db
    plan: free          # free Postgres instances expire - use a paid plan for anything lasting
    databaseName: fraud_db

services:
  - type: web
    name: fraud-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fraud-db
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: RISK_LOW_MAX
        value: "30"
      - key: RISK_MEDIUM_MAX
        value: "70"

  - type: web
    name: fraud-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile.dashboard
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: fraud-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: API_KEY
        fromService:
          type: web
          name: fraud-api
          envVarKey: API_KEY
