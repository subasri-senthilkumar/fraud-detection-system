# Launch everything:   cp .env.example .env   # then edit the password
#                      docker compose up --build
# Train a model first: docker compose --profile train run --rm trainer
name: fraud-detection

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fraud_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fraud_db}
      RISK_LOW_MAX: ${RISK_LOW_MAX:-30}
      RISK_MEDIUM_MAX: ${RISK_MEDIUM_MAX:-70}
      API_KEY: ${API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./models:/app/models
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:-}
    ports:
      - "8501:8501"

  # One-off training job (not started by `up`): generates demo data if none exists.
  trainer:
    profiles: ["train"]
    build:
      context: .
      dockerfile: Dockerfile
    user: root
    working_dir: /app
    command: ["python", "-m", "src.train", "--generate-if-missing"]
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./reports:/app/reports

volumes:
  pgdata:
